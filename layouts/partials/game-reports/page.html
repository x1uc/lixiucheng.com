<section class="container page">
  <article>
    <header>
      <h1>{{ .Title }}</h1>
    </header>

    <a href="{{ .Params.purchase_url }}">
      <img src="{{ .RelPermalink }}cover.jpg" class="align-left game-cover" />
    </a>

    <ul class="game-summary">
      <li>我的评分：<strong>{{ .Params.rating }}</strong> / 10</li>
      <li>
        <a href="{{ .Params.purchase_url }}">购买链接</a>
      </li>
    </ul>

    {{- with .Content -}}
      <div>
        {{ . | replaceRE "(<h[1-9] id=\"([^\"]+)\".+)(</h[1-9]+>)" `${1}<a href="#${2}" class="hanchor" ariaLabel="Anchor"> 🔗&#xFE0E;</a> ${3}` | safeHTML }}
      </div>
    {{- end -}}

    {{ partial "talkyard.html" . }}
  </article>
</section>
