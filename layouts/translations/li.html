<li>
  <a class="img-wrapper" href="{{ .RelPermalink }}">
    {{ partial "list-image.html" . }}
  </a>
  <div>
    <h2><a class="title" href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    <p class="date">
      {{ .Date.Format .Site.Params.dateFormat }}
    </p>
    <p>{{ .Page.Params.description }}</p>
  </div>
</li>
